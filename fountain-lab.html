 <linearGradient id="fallGlaze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7c99c" stop-opacity=".17"/><stop offset=".12" stop-color="#f7c99c" stop-opacity=".08"/><stop offset=".43" stop-color="#f7c99c" stop-opacity="0"/><stop offset=".79" stop-color="#49271f" stop-opacity=".07"/><stop offset=".94" stop-color="#49271f" stop-opacity=".19"/><stop offset="1" stop-color="#d6a17a" stop-opacity=".10"/></linearGradient>
 <radialGradient id="softChocolateLight"><stop stop-color="#ffe0b1" stop-opacity=".24"/><stop offset=".38" stop-color="#f9cda0" stop-opacity=".15"/><stop offset=".73" stop-color="#f4c394" stop-opacity=".045"/><stop offset="1" stop-color="#f4c394" stop-opacity="0"/></radialGradient>
<radialGradient id="softChocolateShade"><stop stop-color="#48241d" stop-opacity=".15"/><stop offset=".50" stop-color="#48241d" stop-opacity=".07"/><stop offset="1" stop-color="#48241d" stop-opacity="0"/></radialGradient>
 <linearGradient id="caramelRock" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4d4a3"/><stop offset=".46" stop-color="#d8a16a"/><stop offset="1" stop-color="#ac6e4b"/></linearGradient>
 
 
</defs><ellipse cy="2" rx="79" ry="7" fill="#82596b" opacity=".21"/><path d="M-73 -4L-65 4H65L73 -4Z" fill="#b58866"/><g transform="translate(0 -14)"><path d="M-67 0Q-60.97 15 0 15Q60.97 15 67 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="67" ry="10.72" fill="#f6dfb6"/><ellipse rx="58.29" ry="7.772" fill="url(#pool)"/><path d="M-51.59 0Q0 -5.36 48.239999999999995 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-53.6 5.3999999999999995Q0 14.25 53.6 5.3999999999999995" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-15 -14Q-8 -29 -12 -46H12Q8 -29 15 -14Z" fill="url(#biscuit)"/><g transform="translate(0 -52)"><path d="M-39 0Q-35.49 12 0 12Q35.49 12 39 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="39" ry="6.24" fill="#f6dfb6"/><ellipse rx="33.93" ry="4.524" fill="url(#pool)"/><path d="M-30.03 0Q0 -3.12 28.08 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-31.200000000000003 4.32Q0 11.399999999999999 31.200000000000003 4.32" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-9 -52L-7 -78H7L9 -52Z" fill="url(#biscuit)"/><g transform="translate(0 -84)"><path d="M-23 0Q-20.93 9 0 9Q20.93 9 23 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="23" ry="3.68" fill="#f6dfb6"/><ellipse rx="20.01" ry="2.668" fill="url(#pool)"/><path d="M-17.71 0Q0 -1.84 16.56 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-18.400000000000002 3.2399999999999998Q0 8.549999999999999 18.400000000000002 3.2399999999999998" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-9 -84Q-10 -92 -4 -96Q0 -99 4 -96Q10 -92 9 -84Q0 -81 -9 -84Z" fill="url(#fallShade)"/><path d="M-5 -92Q-3 -95 0 -95" stroke="#e9b58a" stroke-width="1.3" fill="none"/><g transform="translate(0 -8.5) scale(0.79 0.38)"><defs><clipPath id="clipLower"><path id="maskLower"/></clipPath></defs><path id="bodyLower" fill="url(#fallShade)" stroke="#65392e" stroke-width=".65"/><g clip-path="url(#clipLower)"><rect x="-65" y="-115" width="130" height="115" fill="url(#fallGlaze)"/><ellipse id="shadeLower" cx="22" cy="-70" rx="39" ry="55" fill="url(#softChocolateShade)"/><ellipse id="sheenLowerA" cx="-11" cy="-95" rx="41" ry="44" fill="url(#softChocolateLight)"/><ellipse id="sheenLowerB" cx="-11" cy="-18" rx="41" ry="44" fill="url(#softChocolateLight)"/><ellipse cx="-10" cy="-103" rx="39" ry="13" fill="url(#softChocolateLight)" opacity=".75"/></g></g><g transform="translate(0 -47.4) scale(0.46 0.34)"><defs><clipPath id="clipUpper"><path id="maskUpper"/></clipPath></defs><path id="bodyUpper" fill="url(#fallShade)" stroke="#65392e" stroke-width=".65"/><g clip-path="url(#clipUpper)"><rect x="-65" y="-115" width="130" height="115" fill="url(#fallGlaze)"/><ellipse id="shadeUpper" cx="22" cy="-70" rx="39" ry="55" fill="url(#softChocolateShade)"/><ellipse id="sheenUpperA" cx="-11" cy="-95" rx="41" ry="44" fill="url(#softChocolateLight)"/><ellipse id="sheenUpperB" cx="-11" cy="-18" rx="41" ry="44" fill="url(#softChocolateLight)"/><ellipse cx="-10" cy="-103" rx="39" ry="13" fill="url(#softChocolateLight)" opacity=".75"/></g></g><g fill="none" stroke="#e6b68b" stroke-width="1.05"><path id="ripple1" d="M-57 -15Q-51 -12 -43 -14M43 -14Q51 -12 57 -15"/><path id="ripple2" d="M-34 -52Q-29 -50 -24 -51M24 -51Q29 -50 34 -52"/></g><path d="M-65 -10Q0 10 65 -10" stroke="#f6dbaf" stroke-width="2.4" fill="none"/></g></svg></div>
<div class="controls"><button id="play" aria-pressed="true">השהיה</button><button id="slow" aria-pressed="false">½ מהירות</button><button id="zoom" aria-pressed="false">הגדלה ×2</button><button id="restart">מהתחלה</button></div>
<div class="scrub"><input id="scrub" type="range" min="0" max="3.6" step=".01" value="0" aria-label="זמן במחזור"><span id="time" class="time">0.00 s</span></div>
<p class="caption">מצב רגיל מדמה את קנה המידה במשחק. הגדלה מאפשרת לבחון את הזרימה, ההצללה והנפח של השוקולד. העיצוב והאנימציה עדיין לא הוטמעו בשלב עצמו.</p></main>
<script>
'use strict';
const duration=3.6;
const $=id=>document.getElementById(id);
// Drawn key poses: the curtain stays attached at its lip and its foot.
// Subtle contour variations travel down instead of swinging sideways.
// Each curtain is a single smooth volume, including its rounded foot.
// Narrowing is slight; the silhouette flows rather than splitting into lobes.
const poses=[
 {t:0,d:'M-43 -105 C-46 -95 -43 -84 -41 -72 C-39 -55 -41 -36 -43 -24 C-44 -18 -48 -14 -50 -12 C-27 -6 27 -6 50 -12 C48 -14 44 -18 43 -24 C41 -36 39 -55 41 -72 C43 -84 46 -95 43 -105 C20 -110 -20 -110 -43 -105 Z'},
 {t:1.2,d:'M-43 -105 C-46 -95 -44 -84 -42 -72 C-41 -55 -40 -36 -42 -24 C-44 -18 -48 -14 -50 -12 C-27 -6 27 -6 50 -12 C48 -14 44 -18 44 -24 C43 -36 41 -55 40 -72 C42 -84 46 -95 43 -105 C20 -110 -20 -110 -43 -105 Z'},
 {t:2.4,d:'M-43 -105 C-46 -95 -42 -84 -40 -72 C-40 -55 -43 -36 -44 -24 C-45 -18 -48 -14 -50 -12 C-27 -6 27 -6 50 -12 C48 -14 44 -18 42 -24 C40 -36 40 -55 42 -72 C44 -84 46 -95 43 -105 C20 -110 -20 -110 -43 -105 Z'}
];
poses.push({...poses[0],t:duration});
const num=/-?\d+(?:\.\d+)?/g;
function morph(a,b,p){const dest=b.match(num).map(Number);let j=0;return a.replace(num,v=>(Number(v)+(dest[j++]-Number(v))*p).toFixed(2))}
function frameAt(t){
 t=((t%duration)+duration)%duration;let i=0;while(i<poses.length-2&&t>poses[i+1].t)i++;
 const a=poses[i],b=poses[i+1],f=(t-a.t)/(b.t-a.t),p=f*f*(3-2*f);
 return {d:morph(a.d,b.d,p)};
}
// Soft, wide moving specular lobes. Their opacity vanishes before wrapping,
// so the motion has no visible seam and the sheet is never split into stripes.
function sheenAt(t,offset){
 const p=((t/duration+offset)%1+1)%1;
 return {x:-11+2*Math.sin(p*Math.PI*2),y:-138+151*p,opacity:.87*Math.pow(Math.sin(Math.PI*p),.85)};
}
function rippleAt(t,i){const p=((t/duration+i*.5)%1+1)%1;return {rx:43+23*p,ry:2.7+9*p,opacity:.5*Math.sin(Math.PI*p)}}
let time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,zoomed=false;
function paint(t){
 for(const [id,offset] of [['Upper',.4],['Lower',1.1]]){
  const tt=(t+offset)%duration,f=frameAt(tt);
  $('body'+id).setAttribute('d',f.d);$('mask'+id).setAttribute('d',f.d);
  for(const [suffix,phase] of [['A',0],['B',.5]]){
   const p=sheenAt(tt,phase),el=$('sheen'+id+suffix);
   el.setAttribute('cx',p.x.toFixed(2));el.setAttribute('cy',p.y.toFixed(2));el.setAttribute('opacity',p.opacity.toFixed(3));
  }
  $('shade'+id).setAttribute('cy',(-70+8*Math.sin(tt/duration*Math.PI*2)).toFixed(2));
 }
 for(let i=0;i<2;i++){const p=rippleAt(t,i);$('ripple'+(i+1)).setAttribute('opacity',(.18+p.opacity).toFixed(2))}
 $('scrub').value=t.toFixed(2);$('time').textContent=t.toFixed(2)+' s';
}
function tick(now){if(last!==null&&playing){time=(time+Math.min(.06,(now-last)/1000)*speed)%duration;paint(time)}last=now;requestAnimationFrame(tick)}
function playState(){$('play').textContent=playing?'השהיה':'ניגון';$('play').setAttribute('aria-pressed',String(playing))}
$('play').onclick=()=>{playing=!playing;playState()};
$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').setAttribute('aria-pressed',String(speed===.5))};
$('zoom').onclick=()=>{zoomed=!zoomed;$('scene').setAttribute('viewBox',zoomed?'85 37 170 175':'0 0 340 230');$('zoom').setAttribute('aria-pressed',String(zoomed));$('zoom').textContent=zoomed?'גודל משחק':'הגדלה ×2'};
$('restart').onclick=()=>{time=0;paint(time)};
$('scrub').oninput=e=>{playing=false;playState();time=Number(e.target.value);paint(time)};
playState();paint(0);requestAnimationFrame(tick);
</script></body></html>
