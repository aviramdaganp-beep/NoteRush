</defs><ellipse cy="2" rx="79" ry="7" fill="#82596b" opacity=".21"/><path d="M-73 -4L-65 4H65L73 -4Z" fill="#b58866"/><g transform="translate(0 -14)"><path d="M-67 0Q-60.97 15 0 15Q60.97 15 67 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="67" ry="10.72" fill="#f6dfb6"/><ellipse rx="58.29" ry="7.772" fill="url(#pool)"/><path d="M-51.59 0Q0 -5.36 48.239999999999995 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-53.6 5.3999999999999995Q0 14.25 53.6 5.3999999999999995" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-15 -14Q-8 -29 -12 -46H12Q8 -29 15 -14Z" fill="url(#biscuit)"/><g transform="translate(0 -52)"><path d="M-39 0Q-35.49 12 0 12Q35.49 12 39 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="39" ry="6.24" fill="#f6dfb6"/><ellipse rx="33.93" ry="4.524" fill="url(#pool)"/><path d="M-30.03 0Q0 -3.12 28.08 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-31.200000000000003 4.32Q0 11.399999999999999 31.200000000000003 4.32" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-9 -52L-7 -78H7L9 -52Z" fill="url(#biscuit)"/><g transform="translate(0 -84)"><path d="M-23 0Q-20.93 9 0 9Q20.93 9 23 0Z" fill="url(#biscuit)" stroke="#a57653" stroke-width="1.2"/><ellipse rx="23" ry="3.68" fill="#f6dfb6"/><ellipse rx="20.01" ry="2.668" fill="url(#pool)"/><path d="M-17.71 0Q0 -1.84 16.56 0" stroke="#d6a079" stroke-width="1.6" opacity=".7" fill="none"/><path d="M-18.400000000000002 3.2399999999999998Q0 8.549999999999999 18.400000000000002 3.2399999999999998" stroke="#e8bf90" stroke-width="2.2" fill="none"/></g><path d="M-9 -84Q-10 -92 -4 -96Q0 -99 4 -96Q10 -92 9 -84Q0 -81 -9 -84Z" fill="url(#fallShade)"/><path d="M-5 -92Q-3 -95 0 -95" stroke="#e9b58a" stroke-width="1.3" fill="none"/><g transform="translate(0 -8.5) scale(0.79 0.38)"><defs><clipPath id="clipLower"><path id="maskLower"/></clipPath></defs><path id="bodyLower" fill="url(#fallShade)" stroke="#65352b" stroke-width="1.1"/><g clip-path="url(#clipLower)"><rect x="-60" y="-115" width="120" height="115" fill="url(#fallGlaze)"/><path d="M-31 -112C-39 -80 -23 -49 -33 -9L-24 -9C-17 -50 -34 -80 -23 -112Z" fill="#e0a77b" opacity=".17"/><path d="M-11 -112C-18 -82 -4 -47 -13 -9H-5C5 -49 -9 -83 -3 -112Z" fill="#4b2824" opacity=".17"/><path d="M15 -112C8 -81 23 -48 14 -9H22C31 -49 16 -81 23 -112Z" fill="#e5a978" opacity=".17"/><path d="M32 -112C28 -79 40 -49 32 -9H41C49 -48 37 -78 42 -112Z" fill="#482622" opacity=".16"/><g id="flowLowerA"/><g id="flowLowerB"/><g id="flowLowerC"/><path d="M-38 -103Q-18 -98 0 -100Q18 -102 38 -103" stroke="#edb88b" stroke-width="2.4" fill="none" opacity=".64"/></g><path id="impactLower" fill="url(#fallShade)" opacity=".93"/><path id="lightLower" stroke="#dfad83" stroke-width="1.65" fill="none" opacity=".68"/></g><g transform="translate(0 -47.4) scale(0.46 0.34)"><defs><clipPath id="clipUpper"><path id="maskUpper"/></clipPath></defs><path id="bodyUpper" fill="url(#fallShade)" stroke="#65352b" stroke-width="1.1"/><g clip-path="url(#clipUpper)"><rect x="-60" y="-115" width="120" height="115" fill="url(#fallGlaze)"/><path d="M-31 -112C-39 -80 -23 -49 -33 -9L-24 -9C-17 -50 -34 -80 -23 -112Z" fill="#e0a77b" opacity=".17"/><path d="M-11 -112C-18 -82 -4 -47 -13 -9H-5C5 -49 -9 -83 -3 -112Z" fill="#4b2824" opacity=".17"/><path d="M15 -112C8 -81 23 -48 14 -9H22C31 -49 16 -81 23 -112Z" fill="#e5a978" opacity=".17"/><path d="M32 -112C28 -79 40 -49 32 -9H41C49 -48 37 -78 42 -112Z" fill="#482622" opacity=".16"/><g id="flowUpperA"/><g id="flowUpperB"/><g id="flowUpperC"/><path d="M-38 -103Q-18 -98 0 -100Q18 -102 38 -103" stroke="#edb88b" stroke-width="2.4" fill="none" opacity=".64"/></g><path id="impactUpper" fill="url(#fallShade)" opacity=".93"/><path id="lightUpper" stroke="#dfad83" stroke-width="1.65" fill="none" opacity=".68"/></g><g fill="none" stroke="#e6b68b" stroke-width="1.05"><path id="ripple1" d="M-57 -15Q-51 -12 -43 -14M43 -14Q51 -12 <div class="controls"><button id="play" aria-pressed="true">השהיה</button><button id="slow" aria-pressed="false">½ מהירות</button><button id="zoom" aria-pressed="false">הגדלה ×2</button><button id="restart">מהתחלה</button></div>
<div class="scrub"><input id="scrub" type="range" min="0" max="3.6" step=".01" value="0" aria-label="זמן במחזור"><span id="time" class="time">0.00 s</span></div>
<p class="caption">מצב רגיל מדמה את קנה המידה במשחק. הגדלה מאפשרת לבחון את הזרימה, הקפלים והברק של השוקולד. העיצוב והאנימציה עדיין לא הוטמעו בשלב עצמו.</p></main>
<script>
'use strict';
const duration=3.6;
const $=id=>document.getElementById(id);
// Drawn key poses: the curtain stays attached at its lip and its foot.
// Subtle contour variations travel down instead of swinging sideways.
const poses=[
 {t:0,d:'M-43 -105 C-47 -94 -44 -86 -42 -75 C-39 -55 -45 -39 -44 -24 C-45 -18 -51 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 45 -18 44 -24 C43 -41 39 -57 42 -75 C44 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -50 -15 -56 -12 C-37 -6 35 -6 56 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-52 -12 C-25 -7 24 -7 52 -12'},
 {t:1.2,d:'M-43 -105 C-47 -94 -46 -86 -44 -75 C-40 -55 -42 -39 -43 -24 C-44 -18 -50 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 45 -18 45 -24 C46 -41 42 -57 41 -75 C43 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -51 -15 -57 -12 C-37 -5 35 -6 56 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-53 -12 C-25 -6 24 -7 52 -12'},
 {t:2.4,d:'M-43 -105 C-47 -94 -44 -86 -42 -75 C-43 -55 -46 -39 -45 -24 C-46 -18 -51 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 46 -18 44 -24 C42 -41 40 -57 43 -75 C45 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -50 -15 -56 -12 C-37 -6 35 -5 57 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-52 -12 C-25 -7 24 -6 53 -12'}
];
poses.push({...poses[0],t:duration});
const num=/-?\d+(?:\.\d+)?/g;
function morph(a,b,p){const dest=b.match(num).map(Number);let j=0;return a.replace(num,v=>(Number(v)+(dest[j++]-Number(v))*p).toFixed(2))}
function frameAt(t){
 t=((t%duration)+duration)%duration;let i=0;while(i<poses.length-2&&t>poses[i+1].t)i++;
 const a=poses[i],b=poses[i+1],f=(t-a.t)/(b.t-a.t),p=f*f*(3-2*f);
 return {d:morph(a.d,b.d,p),impact:morph(a.impact,b.impact,p),light:morph(a.light,b.light,p)};
}
// Tonal patches form a repeating 150-unit vertical field. They are
// long, soft and irregular, and clipped to the actual liquid outline.
// Both copies have identical geometry so the downward scroll is seamless.
function flowField(){
 let out='';
 const strips=[[-32,-20,8,50],[-18,32,6,70],[-3,-4,10,62],[12,66,8,53],[30,9,7,80],[-30,99,7,43],[-6,110,7,30],[21,-36,7,51],[10,13,4,48]];
 for(let i=0;i<strips.length;i++){
  const [x,y,w,len]=strips[i],bend=i%2?3:-2;
  const shape='M'+x+' '+y+' C'+(x-w)+' '+(y+len*.24)+' '+(x+bend-w)+' '+(y+len*.73)+' '+(x+bend)+' '+(y+len)+' C'+(x+bend+w)+' '+(y+len*.72)+' '+(x+w)+' '+(y+len*.25)+' '+x+' '+y+'Z';
  out+='<path d="'+shape+'" fill="url(#'+(i%3===1?'foldShadow':'flowSheen')+')" opacity="'+(i%3===1?.72:.86)+'"/>';
 }
 // A second neighboring repeat avoids gaps at both ends of the clip.
 return out;
}
function flowAt(t){const p=((t%duration)+duration)%duration/duration;return [-150+150*p,-300+150*p]}
function rippleAt(t,i){const p=((t/duration+i*.5)%1+1)%1;return {rx:43+23*p,ry:2.7+9*p,opacity:.5*Math.sin(Math.PI*p)}}
let time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,zoomed=false;
for(const id of ['Upper','Lower'])for(const suffix of ['A','B','C'])$('flow'+id+suffix).innerHTML=flowField();
function paint(t){
 for(const [id,offset] of [['Upper',.4],['Lower',1.1]]){
  const tt=(t+offset)%duration,f=frameAt(tt);$('body'+id).setAttribute('d',f.d);$('mask'+id).setAttribute('d',f.d);$('impact'+id).setAttribute('d',f.impact);$('light'+id).setAttribute('d',f.light);
  const [a,b]=flowAt(tt);
  for(const [suffix,y] of [['A',a],['B',b],['C',a+150]])$('flow'+id+suffix).setAttribute('transform','translate(0 '+y.toFixed(2)+')');
 }
 for(let i=0;i<2;i++){const p=rippleAt(t,i);$('ripple'+(i+1)).setAttribute('opacity',(.18+p.opacity).toFixed(2))}
 $('scrub').value=t.toFixed(2);$('time').textContent=t.toFixed(2)+' s';
}
function tick(now){if(last!==null&&playing){time=(time+Math.min(.06,(now-last)/1000)*speed)%duration;paint(time)}last=now;requestAnimationFrame(tick)}
function playState(){$('play').textContent=playing?'השהיה':'ניגון';$('play').setAttribute('aria-pressed',String(playing))}
$('play').onclick=()=>{playing=!playing;playState()};
$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').setAttribute('aria-pressed',String(speed===.5))};
$('zoom').onclick=()=>{zoomed=!zoomed;$('scene').setAttribute('viewBox',zoomed?'85 37 170 175':'0 0 340 230');$('zoom').setAttribute('aria-pressed',String(zoomed));$('zoom').textContent=zoomed?'גודל משחק':'הגדלה ×2'};
$('restart').onclick=()=>{time=0;paint(time)};
$('scrub').oninput=e=>{playing=false;playState();time=Number(e.target.value);paint(time)};
playState();paint(0);requestAnimationFrame(tick);
</script></body></html>
