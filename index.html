<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOTE RUSH — Piano Live</title><style>
*{box-sizing:border-box}body{margin:0;background:#13152a;color:#fff;font-family:Arial,sans-serif;text-align:center}main{max-width:620px;margin:auto;padding:18px;background:radial-gradient(ellipse at top left,#39336e,transparent 65%),#1b1c36;min-height:100vh}h1{font-size:clamp(36px,9vw,54px);font-style:italic;letter-spacing:-2px;direction:ltr;margin:10px 0 2px;text-shadow:0 4px #0005}h1 b{color:#ffdb70}.small{font-size:13px;color:#b9bddf;line-height:1.5}.panel{background:#ffffff0a;border:1px solid #ffffff22;border-radius:16px;padding:14px;margin:12px 0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:12px;padding:12px 16px;font-weight:bold;background:#ffdb70;color:#513b15;box-shadow:0 4px #b78331}button:active:not(:disabled){transform:translateY(3px);box-shadow:none}button:disabled{opacity:.5;cursor:default}.secondary{background:#444369;color:#fff;box-shadow:0 3px #29284b;font-size:13px}input[type=text]{width:100%;padding:12px;border-radius:10px;background:#10132b;color:white;border:1px solid #77749e;text-align:center;margin:10px 0}input[type=range]{accent-color:#b4a0ff;width:110px}.row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.meter{height:9px;border-radius:9px;background:#10132b;overflow:hidden;margin:8px 0;direction:ltr}.fill{height:100%;background:#77edaa;border-radius:9px;transition:width .08s}#detected{font-size:30px;color:#8bffbe;font-weight:bold}#clock{font-size:60px;line-height:1.1;font-weight:900;letter-spacing:-3px;color:#ffdc70;direction:ltr;font-variant-numeric:tabular-nums}#clock.danger{color:#ff6689;animation:pulse .75s infinite}#clock.plus{color:#78ffb4}#clock.minus{color:#ff6689;animation:shake .35s}#float{position:absolute;left:calc(50% + 76px);top:30px;font-size:25px;font-weight:bold;opacity:0;direction:ltr}#float.up{color:#78ffb4;animation:float 1.2s}#float.down{color:#ff6689;animation:float 1.2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#ffffff12;padding:10px;border-radius:13px}.stat b{display:block;font-size:26px}.stage{background:#fffdf4;color:#292940;border:4px solid #a18dff;border-radius:18px;overflow:hidden;box-shadow:0 5px #55448f}.stage.hit{animation:hit .3s}.stage.miss{animation:shake .3s}#feedback{font-size:18px;font-weight:bold;height:36px}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr;margin:16px 0}.keys button{background:#7863d2;color:white;box-shadow:0 4px #48368f;padding:16px 0;font-size:21px}.keys button.good{background:#24a779}.keys button.bad{background:#d54b6b}.jump{animation:jump .23s cubic-bezier(.2,.8,.3,1.3)}.rank{display:grid;grid-template-columns:30px 1fr 60px 55px;gap:6px;text-align:right;padding:10px;border-top:1px solid #ffffff19}.rank span{overflow-wrap:anywhere}[hidden]{display:none!important}@keyframes pulse{50%{opacity:.55}}@keyframes float{0%{opacity:1;transform:scale(.7)}20%{transform:scale(1.2)}65%{opacity:1}100%{opacity:0;transform:translateY(-25px)}}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}@keyframes hit{50%{border-color:#4ee19e;box-shadow:0 0 20px #4ee19e}}@keyframes jump{from{transform:translateY(-28px);opacity:.2}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head><body><main><h1>NOTE <b>RUSH</b></h1><div class="small">PIANO LIVE · LEVEL 01</div><section class="panel"><div class="row"><button id="mic">🎙 הפעל מיקרופון</button><button class="secondary" id="off" hidden>כבה מיקרופון</button></div><p class="small" id="status" role="status">המיקרופון כבוי</p><div class="meter"><div class="fill" id="volume" style="width:0"></div></div><div id="detected">—</div><div class="small" id="freq">נגנו צליל בודד לבדיקה</div><div class="row small" style="margin-top:10px"><label>רגישות <input id="sens" type="range" min="1" max="5" value="3"></label><label><input type="checkbox" id="sound"> סאונד משחק</label></div></section><section class="panel" id="login"><b style="font-size:22px">מי משחק?</b><form id="form"><input type="text" id="name" required maxlength="30" placeholder="שם התלמיד"><button>כניסה</button></form></section><section id="game" hidden><div class="row" style="justify-content:space-between"><b id="player"></b><div class="row"><button class="secondary" id="reset">↻ איפוס</button><button class="secondary" id="switch">החלף שחקן</button></div></div><div class="panel" style="position:relative"><div class="small">TIME LEFT</div><div id="clock">1:00</div><div id="float"></div><div class="meter"><div id="timebar" class="fill" style="width:100%;background:#ffdc70"></div></div></div><div class="stats"><div class="stat"><b id="score" style="color:#8bffbe">0</b>נקודות</div><div class="stat"><b id="streak" style="color:#ffdc70">0</b>🔥 רצף</div><div class="stat"><b id="acc" style="color:#c5b4ff">—</b>דיוק</div></div><div class="stage" id="stage"><div id="staff" hidden><svg viewBox="0 0 340 185" width="100%" style="display:block;max-height:265px" aria-label="חמשה במפתח סול"><path d="M18 48H322 M18 68H322 M18 88H322 M18 108H322 M18 128H322" fill="none" stroke="#424454" stroke-width="1.4"/><path d="M65 164 C82 169 85 151 78 128 L60 57 C55 33 65 13 73 23 C88 43 63 65 49 85 C21 116 42 141 66 136 C91 131 91 100 71 98 C51 96 44 113 56 124 M65 164 C52 168 48 155 57 152" fill="none" stroke="#25283e" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="57" cy="154" rx="6" ry="7" fill="#25283e"/><g id="jump"><line id="ledger" x1="172" y1="148" x2="218" y2="148" stroke="#25283e" stroke-width="1.8"/><g id="note" transform="translate(195 148)" fill="#25283e"><ellipse rx="12.5" ry="8.6" transform="rotate(-20)"/><line x1="11" y1="-2" x2="11" y2="-61" stroke="#25283e" stroke-width="2.5"/></g></g></svg><div id="feedback">נגנו את התו!</div></div><div id="ready" style="padding:24px 8px"><div style="font-size:40px">🎹</div><h2 id="readytitle">מוכנים?</h2><p id="readydetails">נגנו את התו שמופיע בחמשה</p><button id="start">▶ התחל משחק</button></div></div><div class="keys" id="keys"><button>דו</button><button>רה</button><button>מי</button><button>פה</button><button>סול</button></div><p id="mode" class="small"></p><p id="personal" class="small"></p></section><section id="board" class="panel"><b style="color:#ffdc70;font-size:19px">🏆 היכל התהילה</b><div id="ranks" class="small"></div></section><p class="small">עיבוד השמע נעשה במכשיר בלבד. אין הקלטה או העלאה של שמע.</p></main><script>
'use strict';const $=id=>document.getElementById(id),keys=[...$('keys').querySelectorAll('button')],pitches=[60,62,64,65,67],names=['דו','דו♯','רה','רה♯','מי','פה','פה♯','סול','סול♯','לה','לה♯','סי'];let records=[],persistent=false;const storage='note-rush-local-piano-v1';try{records=JSON.parse(localStorage.getItem(storage)||'[]');if(!Array.isArray(records))records=[];records=records.filter(r=>r&&typeof r.name==='string'&&Number.isFinite(r.score)&&Number.isFinite(r.acc)&&Number.isFinite(r.best));localStorage.setItem(storage,JSON.stringify(records));persistent=true}catch(e){}let ctx,stream,source,analyser,buffer,mic=false,requesting=false,listenTimer,candidate=null,stable=0,held=null,quiet=0,lastInput=0,prevRms=0,onset=false;let player='',mode='buttons',running=false,locked=false,deadline=0,timer,pending,current=-1,score=0,streak=0,attempts=0,mistakes=0,best=0,effectUntil=0,effect='',lastTick=0,parity=0;const now=()=>performance.now(),norm=s=>s.trim().replace(/\s+/g,' ').normalize('NFKC').toLocaleLowerCase(),accuracy=()=>attempts?Math.round(score*100/attempts):0,record=()=>records.find(r=>norm(r.name)===norm(player)&&r.mode===mode);
function board(){let e=$('ranks');e.replaceChildren();let rows=records.filter(r=>r.mode===mode).sort((a,b)=>b.score-a.score||b.acc-a.acc||b.best-a.best);if(!rows.length)e.textContent='עדיין אין שיאים';rows.forEach((r,i)=>{let d=document.createElement('div');d.className='rank';[['🥇','🥈','🥉'][i]||i+1,r.name,r.score,r.acc+'%'].forEach(v=>{let s=document.createElement('span');s.textContent=v;d.append(s)});e.append(d)});let p=document.createElement('p');p.textContent=(mode==='mic'?'שיאי נגינה':'שיאי כפתורים')+' · '+(persistent?'שמירה מקומית':'סשן בלבד');e.append(p);$('personal').textContent='🏆 שיא אישי: '+(record()?.score??0)}
function audio(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');ctx=new AC()}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}function tone(f,d=.06,v=.03,type='sine',delay=0){if(!$('sound').checked)return;try{let c=audio(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.005)}catch(e){}}function tick(){parity^=1;tone(parity?1180:870,.028,.035,'triangle')}
async function enableMic(){if(requesting||mic)return;requesting=true;$('mic').disabled=true;$('status').textContent='מבקש הרשאת מיקרופון…';try{let c=audio();if(!navigator.mediaDevices?.getUserMedia)throw Error('הדפדפן אינו מאפשר מיקרופון בדף זה');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});await c.resume();source=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=4096;source.connect(analyser);buffer=new Float32Array(4096);mic=true;mode='mic';$('sound').checked=false;$('mic').textContent='🎙 מיקרופון פעיל';$('off').hidden=false;$('status').textContent='מקשיב · נגן דו אמצעי C4';$('status').style.color='#8bffbe';candidate=held=null;stable=quiet=lastInput=prevRms=0;onset=false;listenTimer=setInterval(listen,65);stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>disableMic()));if(player)ready();board()}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('status').textContent='המיקרופון לא הופעל: '+(e.name==='NotAllowedError'?'הרשאה נדחתה או חסומה':e.message||e.name);$('status').style.color='#ff8ba1';$('mic').disabled=false}finally{requesting=false}}
function disableMic(){if(!mic)return;mic=false;clearInterval(listenTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{source.disconnect()}catch(e){}mode='buttons';$('mic').disabled=false;$('mic').textContent='🎙 הפעל מיקרופון';$('off').hidden=true;$('status').textContent='המיקרופון כבוי';$('status').style.color='';$('detected').textContent='—';$('freq').textContent='';$('volume').style.width='0';if(player)ready();board()}
function detect(buf,sr){const min=Math.floor(sr/1800),max=Math.min(1500,Math.floor(sr/55)),win=Math.min(1500,buf.length-max-1),diff=new Float64Array(max+1);let sum=0;diff[0]=1;for(let t=1;t<=max;t++){let d=0;for(let i=0;i<win;i++){const z=buf[i]-buf[i+t];d+=z*z}sum+=d;diff[t]=sum?d*t/sum:1}let lag=-1;for(let t=min;t<max-1;t++)if(diff[t]<.18){while(t+1<max&&diff[t+1]<diff[t])t++;lag=t;break}if(lag<0){let low=.23;for(let t=min;t<max;t++)if(diff[t]<low){low=diff[t];lag=t}}if(lag<1)return null;const a=diff[lag-1],b=diff[lag],c=diff[lag+1],den=a-2*b+c,shift=den?Math.max(-.5,Math.min(.5,.5*(a-c)/den)):0;return {hz:sr/(lag+shift),clarity:1-b}}
function listen(){if(!mic)return;analyser.getFloatTimeDomainData(buffer);let sum=0;for(let v of buffer)sum+=v*v;let rms=Math.sqrt(sum/buffer.length),threshold=[.025,.015,.009,.0045,.002][+$('sens').value-1];$('volume').style.width=Math.min(100,rms*650)+'%';if(rms<threshold){quiet++;candidate=null;stable=0;prevRms=rms;if(quiet>=3){held=null;onset=false;$('detected').textContent='—';$('freq').textContent='ממתין לצליל'}return}if(rms>Math.max(threshold*2.2,prevRms*2)&&now()-lastInput>300)onset=true;prevRms=rms;quiet=0;const p=detect(buffer,ctx.sampleRate);if(!p||p.clarity<.77){candidate=null;stable=0;return}const exact=69+12*Math.log2(p.hz/440),midi=Math.round(exact);if(Math.abs(exact-midi)>.43){candidate=null;stable=0;return}if(midi===candidate)stable++;else{candidate=midi;stable=1}if(stable<2)return;$('detected').textContent=names[(midi%12+12)%12]+' '+(Math.floor(midi/12)-1);$('freq').textContent=p.hz.toFixed(1)+' Hz · יציבות '+Math.round(p.clarity*100)+'%';if((midi!==held||onset)&&now()-lastInput>210){held=midi;onset=false;lastInput=now();if(running&&mode==='mic'&&!locked)answer(midi)}}
function stats(){$('score').textContent=score;$('streak').textContent=streak;$('acc').textContent=attempts?accuracy()+'%':'—'}function flash(e,c){e.classList.remove(c);void e.getBoundingClientRect();e.classList.add(c)}function feedback(t,c){$('feedback').textContent=t;$('feedback').style.color=c}function next(){if(!running)return;const opts=[0,1,2,3,4].filter(i=>i!==current);current=opts[Math.floor(Math.random()*opts.length)];$('note').setAttribute('transform','translate(195 '+(148-current*10)+')');$('ledger').style.display=current===0?'':'none';flash($('jump'),'jump');keys.forEach(b=>{b.disabled=false;b.className=''});locked=false;feedback(mode==='mic'?'נגנו את התו!':'איזה תו זה?','#77748a')}
function change(n){deadline+=n*1000;effect=n>0?'plus':'minus';effectUntil=now()+1000;$('float').textContent=(n>0?'+':'−')+Math.abs(n)+'s';$('float').className='';void $('float').offsetWidth;$('float').className=n>0?'up':'down';if(n>0){tone(523,.09);tone(659,.09,.03,'sine',.07);tone(784,.13,.04,'sine',.14)}else{tone(220,.12,.04,'triangle');tone(110,.16,.04,'triangle',.09)}}
function answer(midi){if(!running||locked)return;if(now()>=deadline){finish();return}attempts++;keys.forEach(b=>b.className='');if(midi===pitches[current]){score++;streak++;best=Math.max(best,streak);locked=true;keys[current].classList.add('good');keys.forEach(b=>b.disabled=true);const r=streak%12,n=r===5?2:r===10?3:r===0?5:0;if(n)change(n);else tone(760);flash($('stage'),'hit');feedback(n?'⚡ עוד '+n+' שניות!':'✓ בול!','#159361');stats();update();if(running)pending=setTimeout(next,180)}else{mistakes++;streak=0;const i=pitches.indexOf(midi);if(i>=0)keys[i].classList.add('bad');flash($('stage'),'miss');if(mistakes%3===0){let n=3+Math.floor(Math.random()*3);change(-n);feedback('אופס! −'+n+' שניות','#d53c61')}else{tone(190,.1,.035,'triangle');feedback('נסו שוב!','#d53c61')}stats();update()}}
function update(){if(!running)return;let t=now(),rem=Math.max(0,deadline-t),s=Math.ceil(rem/1000);$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('clock').className=t<effectUntil?effect:s<=10?'danger':'';$('timebar').style.width=Math.min(100,rem/600)+'%';$('timebar').style.background=t<effectUntil&&effect==='plus'?'#77edaa':s<=10||t<effectUntil&&effect==='minus'?'#ff6689':'#ffdc70';if(rem<=0){finish();return}let period=s<=3?250:s<=10?500:1000;if(t-lastTick>=period){lastTick=t;tick()}}
function stop(){running=false;locked=true;clearInterval(timer);clearTimeout(pending);keys.forEach(b=>b.disabled=true)}function clear(){stop();score=streak=attempts=mistakes=best=0;current=-1;effectUntil=0;effect='';$('clock').textContent='1:00';$('clock').className='';$('timebar').style.width='100%';$('timebar').style.background='#ffdc70';$('float').className='';stats()}function ready(){clear();$('login').hidden=true;$('game').hidden=false;$('staff').hidden=true;$('ready').hidden=false;$('board').hidden=false;$('keys').hidden=mode==='mic';$('player').textContent='🎮 '+player;$('readytitle').textContent='מוכנים?';$('readydetails').textContent=mode==='mic'?'נגנו בפסנתר מדו אמצעי ועד סול':'בחרו את התו הנכון';$('mode').textContent=mode==='mic'?'🎙 מצב נגינה · אוקטבה 4':'מצב כפתורים';$('start').textContent='▶ התחל משחק';board()}function start(){if(!player||running)return;clear();if($('sound').checked)try{audio()}catch(e){}$('ready').hidden=true;$('staff').hidden=false;$('board').hidden=true;running=true;deadline=now()+60000;lastTick=now();next();tick();timer=setInterval(update,40)}function finish(){if(!running)return;stop();$('clock').textContent='0:00';$('clock').className='danger';$('timebar').style.width='0';let prev=record(),fresh=!prev||score>prev.score;if(fresh||prev&&score===prev.score&&(accuracy()>prev.acc||accuracy()===prev.acc&&best>prev.best)){let r={name:prev?.name||player,mode,score,acc:accuracy(),best};if(prev)records[records.indexOf(prev)]=r;else records.push(r);try{localStorage.setItem(storage,JSON.stringify(records));persistent=true}catch(e){persistent=false}}$('staff').hidden=true;$('ready').hidden=false;$('board').hidden=false;$('readytitle').textContent=fresh&&score?'🏆 שיא חדש!':'הזמן נגמר!';$('readydetails').textContent=score+' תווים נכונים · דיוק '+accuracy()+'% · רצף שיא '+best;$('start').textContent='▶ שחק שוב';board()}$('mic').onclick=enableMic;$('off').onclick=disableMic;$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim();if(n){player=n;ready()}};$('start').onclick=start;$('reset').onclick=ready;$('switch').onclick=()=>{clear();player='';$('name').value='';$('login').hidden=false;$('game').hidden=true;$('board').hidden=false;board()};keys.forEach((b,i)=>b.onclick=()=>answer(pitches[i]));window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});board();
</script></body></html>
