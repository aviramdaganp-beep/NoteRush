<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NoteRush · Fountain lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211e2c;color:#f8f1ec;font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:700px;margin:auto;padding:22px 14px 36px}h1{font-size:24px;line-height:1.2;margin:0 0 6px}p{margin:0;color:#c9c0d0;font-size:13px}.scene{margin:18px auto 12px;max-width:440px;overflow:hidden;border-radius:15px;border:1px solid #786d8c;background:#e5c0ed}.scene svg{width:100%;display:block;height:auto}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:13px 0}button{appearance:none;border:1px solid #70667d;color:#f8f1ec;background:#373142;border-radius:9px;padding:10px 13px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#e7c0d1;color:#322433;border-color:#e7c0d1}button:focus-visible,input:focus-visible{outline:2px solid #f3c89c;outline-offset:3px}.scrub{max-width:440px;margin:auto;display:flex;gap:10px;align-items:center;direction:ltr}.scrub input{width:100%;accent-color:#e7c0d1}.time{font-variant-numeric:tabular-nums;min-width:54px;color:#d8cedb;font-size:12px}.caption{max-width:440px;margin:12px auto;text-align:center}
</style></head>
<body><main><h1>מעבדת מפל השוקולד</h1><p>NoteRush · אבטיפוס 02 · מפל שוקולד סמיך</p>
<div class="scene"><svg id="scene" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="מפל שוקולד מונפש">

<linearGradient id="ground" x2="0" y2="1"><stop stop-color="#b7dfc4"/><stop offset="1" stop-color="#8cbfae"/></linearGradient>
<linearGradient id="biscuit" x1="0" y1="0" x2=".87" y2=".85"><stop stop-color="#fce2b6"/><stop offset=".43" stop-color="#e6b77b"/><stop offset=".78" stop-color="#c48a57"/><stop offset="1" stop-color="#a56849"/></linearGradient>
<linearGradient id="chocolate" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#572e2d"/><stop offset=".22" stop-color="#8f5037"/><stop offset=".44" stop-color="#b77a53"/><stop offset=".59" stop-color="#9b5a3d"/><stop offset=".84" stop-color="#704035"/><stop offset="1" stop-color="#4f2b30"/></linearGradient>

</defs>
<g id="environment"><rect width="340" height="230" fill="url(#sky)"/><ellipse cx="259" cy="63" rx="100" ry="90" fill="url(#halo)"/><path d="M0 128L39 73L58 93L91 30L112 52L146 117L177 75L196 90L229 40L251 59L275 99L306 75L340 115V230H0Z" fill="#aba5ce"/><path d="M64 82L91 30L112 52L129 83Q117 75 113 85Q103 72 97 78Q90 65 83 77Q77 70 64 82ZM208 73L229 40L251 59L263 80Q251 69 243 76Q230 63 223 76Z" fill="#e6bb83"/><path d="M0 137Q68 110 140 140T340 133V230H0Z" fill="#b7a4ca"/><path d="M0 160Q60 142 120 158T246 155T340 151V230H0Z" fill="url(#ground)"/><path d="M0 211Q96 192 172 208T340 204V230H0Z" fill="#d9a0b8"/><path d="M0 211Q96 192 172 208T340 204" stroke="#f7d8da" stroke-width="8" fill="none"/></g>
<g id="fountain" transform="translate(170 188)" stroke-linecap="round" stroke-linejoin="round">
<defs>
 <linearGradient id="fallShade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59312c"/><stop offset=".09" stop-color="#84472e"/><stop offset=".24" stop-color="#b4774f"/><stop offset=".42" stop-color="#925033"/><stop offset=".57" stop-color="#a86643"/><stop offset=".79" stop-color="#77402f"/><stop offset=".94" stop-color="#99593d"/><stop offset="1" stop-color="#542d2b"/></linearGradient>
 <linearGradient id="fallGlaze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4c394" stop-opacity=".27"/><stop offset=".28" stop-color="#f2bc91" stop-opacity=".03"/><stop offset=".83" stop-color="#472720" stop-opacity=".03"/><stop offset="1" stop-color="#3f201d" stop-opacity=".31"/></linearGradient>
 <linearGradient id="flowSheen" x1="0" y1="0" x2=".06" y2="1"><stop stop-color="#ffdaa9" stop-opacity="0"/><stop offset=".25" stop-color="#ffdaa9" stop-opacity=".13"/><stop offset=".52" stop-color="#ffd0a2" stop-opacity=".32"/><stop offset=".82" stop-color="#e8ae7f" stop-opacity=".13"/><stop offset="1" stop-color="#e8ae7f" stop-opacity="0"/></linearGradient>
 <linearGradient id="foldShadow" x1="0" y1="0" x2=".05" y2="1"><stop stop-color="#432323" stop-opacity="0"/><stop offset=".52" stop-color="#432323" stop-opacity=".27"/><stop offset="1" stop-color="#432323" stop-opacity="0"/></linearGradient>
 <linearGradient id="caramelRock" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4d4a3"/><stop offset=".46" stop-color="#d8a16a"/><stop offset="1" stop-color="#ac6e4b"/></linearGradient>
 <clipPath id="fallClip"><path id="fallMask"/></clipPath>
 <clipPath id="chocPoolClip"><ellipse cx="0" cy="-12" rx="67" ry="14"/></clipPath>
</defs>
<!-- Basin integrated with a single raised confectionery terrace. -->
<ellipse cy="9" rx="85" ry="10" fill="#755565" opacity=".17"/>
<path d="M-76 -13Q-74 5 -52 11Q0 21 52 11Q74 5 76 -13Z" fill="url(#biscuit)" stroke="#ae7955" stroke-width=".9"/>
<path d="M-66 -4Q0 23 66 -4" stroke="#b77b54" stroke-width="1.5" fill="none" opacity=".65"/>
<ellipse cy="-13" rx="76" ry="19" fill="#f7d5a4" stroke="#c59160" stroke-width="1"/>
<ellipse cy="-12" rx="67" ry="14" fill="url(#pool)"/>
<path d="M-61 -13Q-40 -22 -22 -21M24 -21Q45 -22 62 -13" stroke="#dfb28b" stroke-width="1.6" fill="none" opacity=".55"/>
<!-- Edible cliff: cake layers, wafer-colored sides and a continuous top spillway. -->
<path d="M-55 -99Q-48 -108 -29 -110L39 -110Q56 -107 58 -96L53 -27Q44 -14 18 -13L-38 -16Q-58 -21 -58 -34Z" fill="url(#caramelRock)" stroke="#ac7350" stroke-width="1"/>
<path d="M-58 -70Q-47 -64 -35 -66L43 -69L56 -74L55 -65L43 -59L-34 -57Q-47 -56 -58 -62Z" fill="#8e5139"/>
<path d="M-58 -41Q-45 -35 -31 -37L43 -41L54 -46L53 -39L43 -32L-31 -30Q-46 -28 -58 -34Z" fill="#9d5e43"/>
<path d="M-55 -96Q-48 -91 -42 -89L-43 -26Q-51 -28 -55 -35Z" fill="#f7d5a2" opacity=".36"/>
<path d="M45 -98L58 -96L53 -27Q48 -19 38 -18Z" fill="#8f523d" opacity=".26"/>
<g fill="#a96a48" opacity=".62"><circle cx="-50" cy="-80" r="1.2"/><circle cx="-46" cy="-49" r="1"/><circle cx="-50" cy="-26" r="1.1"/><circle cx="48" cy="-81" r="1.1"/><circle cx="46" cy="-50" r="1.1"/></g>
<!-- The chocolate reservoir curves smoothly over the front lip. -->
<ellipse cy="-105" rx="57" ry="13" fill="#edbb7e" stroke="#bb8055" stroke-width="1.1"/>
<ellipse cy="-105" rx="51" ry="9.3" fill="url(#pool)"/>
<path d="M-46 -106Q-28 -113 -10 -110Q8 -107 26 -110Q42 -111 47 -106" stroke="#d9a277" stroke-width="1.5" fill="none" opacity=".66"/>
<path d="M-50 -101Q-42 -93 -39 -96H39Q48 -94 53 -102" stroke="#f3d6a7" stroke-width="3" fill="none"/>
<!-- Solid, wide liquid sheet. Its outline moves only a few units. -->
<path id="fallBody" fill="url(#fallShade)" stroke="#65352b" stroke-width=".7"/>
<g clip-path="url(#fallClip)">
 <rect x="-65" y="-115" width="130" height="115" fill="url(#fallGlaze)"/>
 <!-- Broad continuous volume folds, not outline strokes. -->
 <path d="M-33 -112C-41 -80 -25 -49 -35 -9L-25 -9C-17 -50 -35 -80 -24 -112Z" fill="#e0a77b" opacity=".16"/>
 <path d="M-11 -112C-18 -82 -4 -47 -13 -9H-5C5 -49 -9 -83 -3 -112Z" fill="#4b2824" opacity=".16"/>
 <path d="M15 -112C8 -81 23 -48 14 -9H22C31 -49 16 -81 23 -112Z" fill="#e5a978" opacity=".13"/>
 <path d="M32 -112C28 -79 40 -49 32 -9H41C49 -48 37 -78 42 -112Z" fill="#482622" opacity=".17"/>
 <g id="flowA"></g><g id="flowB"></g><g id="flowC"></g>
 <path d="M-37 -102Q-17 -97 0 -101Q18 -104 37 -100" stroke="#f4c297" stroke-width="2.2" fill="none" opacity=".64"/>
</g>
<!-- A broad, attached impact roll in the same color as the curtain. -->
<g clip-path="url(#chocPoolClip)">
 <path id="impact" fill="url(#fallShade)" opacity=".95"/>
 <path id="impactLight" fill="none" stroke="#d8a276" stroke-width="1.45" opacity=".7"/>
 <ellipse id="ripple1" cy="-10" rx="46" ry="5" fill="none" stroke="#e8b68a" stroke-width="1.25"/>
 <ellipse id="ripple2" cy="-10" rx="51" ry="8" fill="none" stroke="#daa276" stroke-width="1.1"/>
</g>
<path d="M-74 -10Q-61 5 0 5Q61 5 74 -10" stroke="#ffe4b7" stroke-width="3.3" fill="none"/>
<path d="M-62 -3Q0 12 62 -3" stroke="#cf9866" stroke-width="1.1" fill="none"/>
</g></svg></div>
<div class="controls"><button id="play" aria-pressed="true">השהיה</button><button id="slow" aria-pressed="false">½ מהירות</button><button id="zoom" aria-pressed="false">הגדלה ×2</button><button id="restart">מהתחלה</button></div>
<div class="scrub"><input id="scrub" type="range" min="0" max="3.6" step=".01" value="0" aria-label="זמן במחזור"><span id="time" class="time">0.00 s</span></div>
<p class="caption">מצב רגיל מדמה את קנה המידה במשחק. הגדלה מאפשרת לבחון את הזרימה, הקפלים והברק של השוקולד. העיצוב והאנימציה עדיין לא הוטמעו בשלב עצמו.</p></main>
<script>
'use strict';
const duration=3.6;
const $=id=>document.getElementById(id);
// Drawn key poses: the curtain stays attached at its lip and its foot.
// Subtle contour variations travel down instead of swinging sideways.
const poses=[
 {t:0,d:'M-43 -105 C-47 -94 -44 -86 -42 -75 C-39 -55 -45 -39 -44 -24 C-45 -18 -51 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 45 -18 44 -24 C43 -41 39 -57 42 -75 C44 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -50 -15 -56 -12 C-37 -6 35 -6 56 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-52 -12 C-25 -7 24 -7 52 -12'},
 {t:1.2,d:'M-43 -105 C-47 -94 -46 -86 -44 -75 C-40 -55 -42 -39 -43 -24 C-44 -18 -50 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 45 -18 45 -24 C46 -41 42 -57 41 -75 C43 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -51 -15 -57 -12 C-37 -5 35 -6 56 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-53 -12 C-25 -6 24 -7 52 -12'},
 {t:2.4,d:'M-43 -105 C-47 -94 -44 -86 -42 -75 C-43 -55 -46 -39 -45 -24 C-46 -18 -51 -14 -49 -12 C-27 -7 29 -7 49 -12 C51 -14 46 -18 44 -24 C42 -41 40 -57 43 -75 C45 -87 47 -95 43 -105 C20 -110 -20 -110 -43 -105 Z',impact:'M-46 -19 C-43 -17 -50 -15 -56 -12 C-37 -6 35 -5 57 -12 C49 -15 43 -17 46 -19 C22 -15 -22 -15 -46 -19 Z',light:'M-52 -12 C-25 -7 24 -6 53 -12'}
];
poses.push({...poses[0],t:duration});
const num=/-?\d+(?:\.\d+)?/g;
function morph(a,b,p){const dest=b.match(num).map(Number);let j=0;return a.replace(num,v=>(Number(v)+(dest[j++]-Number(v))*p).toFixed(2))}
function frameAt(t){
 t=((t%duration)+duration)%duration;let i=0;while(i<poses.length-2&&t>poses[i+1].t)i++;
 const a=poses[i],b=poses[i+1],f=(t-a.t)/(b.t-a.t),p=f*f*(3-2*f);
 return {d:morph(a.d,b.d,p),impact:morph(a.impact,b.impact,p),light:morph(a.light,b.light,p)};
}
// Tonal patches form a repeating 150-unit vertical field. They are
// long, soft and irregular, and clipped to the actual liquid outline.
// Both copies have identical geometry so the downward scroll is seamless.
function flowField(){
 let out='';
 const strips=[[-32,-20,8,50],[-18,32,6,70],[-3,-4,10,62],[12,66,8,53],[30,9,7,80],[-30,99,7,43],[-6,110,7,30],[21,-36,7,51],[10,13,4,48]];
 for(let i=0;i<strips.length;i++){
  const [x,y,w,len]=strips[i],bend=i%2?3:-2;
  const shape='M'+x+' '+y+' C'+(x-w)+' '+(y+len*.24)+' '+(x+bend-w)+' '+(y+len*.73)+' '+(x+bend)+' '+(y+len)+' C'+(x+bend+w)+' '+(y+len*.72)+' '+(x+w)+' '+(y+len*.25)+' '+x+' '+y+'Z';
  out+='<path d="'+shape+'" fill="url(#'+(i%3===1?'foldShadow':'flowSheen')+')" opacity="'+(i%3===1?.72:.86)+'"/>';
 }
 // A second neighboring repeat avoids gaps at both ends of the clip.
 return out;
}
function flowAt(t){const p=((t%duration)+duration)%duration/duration;return [-150+150*p,-300+150*p]}
function rippleAt(t,i){const p=((t/duration+i*.5)%1+1)%1;return {rx:43+23*p,ry:2.7+9*p,opacity:.5*Math.sin(Math.PI*p)}}
let time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,zoomed=false;
$('flowA').innerHTML=flowField();$('flowB').innerHTML=flowField();$('flowC').innerHTML=flowField();
function paint(t){
 const f=frameAt(t);$('fallBody').setAttribute('d',f.d);$('fallMask').setAttribute('d',f.d);$('impact').setAttribute('d',f.impact);$('impactLight').setAttribute('d',f.light);
 const [a,b]=flowAt(t);$('flowA').setAttribute('transform','translate(0 '+a.toFixed(2)+')');$('flowB').setAttribute('transform','translate(0 '+b.toFixed(2)+')');$('flowC').setAttribute('transform','translate(0 '+(a+150).toFixed(2)+')');
 for(let i=0;i<2;i++){const p=rippleAt(t,i),r=$('ripple'+(i+1));r.setAttribute('rx',p.rx.toFixed(2));r.setAttribute('ry',p.ry.toFixed(2));r.setAttribute('opacity',p.opacity.toFixed(2))}
 $('scrub').value=t.toFixed(2);$('time').textContent=t.toFixed(2)+' s';
}
function tick(now){if(last!==null&&playing){time=(time+Math.min(.06,(now-last)/1000)*speed)%duration;paint(time)}last=now;requestAnimationFrame(tick)}
function playState(){$('play').textContent=playing?'השהיה':'ניגון';$('play').setAttribute('aria-pressed',String(playing))}
$('play').onclick=()=>{playing=!playing;playState()};
$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').setAttribute('aria-pressed',String(speed===.5))};
$('zoom').onclick=()=>{zoomed=!zoomed;$('scene').setAttribute('viewBox',zoomed?'85 37 170 175':'0 0 340 230');$('zoom').setAttribute('aria-pressed',String(zoomed));$('zoom').textContent=zoomed?'גודל משחק':'הגדלה ×2'};
$('restart').onclick=()=>{time=0;paint(time)};
$('scrub').oninput=e=>{playing=false;playState();time=Number(e.target.value);paint(time)};
playState();paint(0);requestAnimationFrame(tick);
</script></body></html>
